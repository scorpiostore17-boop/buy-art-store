<div style="font-family:Arial,Helvetica,sans-serif;color:#0a1330;max-width:560px;margin:0 auto;padding:20px;border:2px solid #013294;border-radius:14px;">
  <h2 style="margin:0 0 12px;color:#013294;">New message from {{store_name}} contact form</h2>
  <p style="margin:0 0 4px;"><strong>Name:</strong> {{from_name}}</p>
  <p style="margin:0 0 4px;"><strong>Email:</strong> {{from_email}}</p>
  <p style="margin:0 0 4px;"><strong>Phone:</strong> {{phone}}</p>
  <p style="margin:0 0 12px;"><strong>Subject:</strong> {{subject}}</p>
  <div style="padding:14px;background:#f6efe2;border-radius:10px;white-space:pre-wrap;line-height:1.5;">{{message}}</div>
</div>
